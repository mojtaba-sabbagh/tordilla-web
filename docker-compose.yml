services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tordilla-web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    # .env.docker (baked in as /app/.env) points DATABASE_URL at
    # host.docker.internal. Docker Desktop resolves that name on its own;
    # this makes it resolve on a Linux host too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded blog images. Without this they live only in the container's
      # writable layer and every `docker compose build` throws them away.
      - tordilla-media:/app/data/media
    restart: unless-stopped

volumes:
  tordilla-media:
